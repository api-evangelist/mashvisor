aid: mashvisor
name: Mashvisor
description: >-
  Mashvisor is a real estate investment analytics platform for the US housing
  market. Its Data API gives investors, agents, property managers, and developers
  programmatic access to short-term (Airbnb) and long-term (traditional) rental
  performance, MLS listings and property records, neighborhood and city analytics,
  rental-rate estimates, investment ROI and cash-flow breakdowns, predictive
  scores, and market trends. All API operations are read-only GET requests
  authenticated with an x-api-key header and scoped by US state; responses are
  JSON. Plans range from a free developer trial to Enterprise. Mashvisor was
  surfaced as a 500 Global portfolio company and enriched by the API Evangelist
  pipeline from its public developer documentation.
